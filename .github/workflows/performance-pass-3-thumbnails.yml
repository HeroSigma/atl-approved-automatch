name: AutoMatch responsive thumbnail pass

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add responsive cover sizing
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          files=[Path('index.html'),Path('404.html')]

          old_vars="""const coverCache=new Map();
          const coverQueue=new Map();
          let coverQueueTimer=null;
          let coverObserver=null;
          let coverRequestActive=false;"""

          new_vars="""const coverCache=new Map();
          const coverQueue=new Map();
          let coverQueueTimer=null;
          let coverObserver=null;
          let coverRequestActive=false;
          const VEHICLE_COVER_WIDTH=window.innerWidth<768?420:window.innerWidth<1024?560:640;"""

          old_request="""const response=await apiJsonp('covers',{ids:ids.join(',')});"""
          new_request="""const response=await apiJsonp('covers',{ids:ids.join(','),width:VEHICLE_COVER_WIDTH});"""

          for path in files:
            text=path.read_text(encoding='utf-8')

            if old_vars in text:
              text=text.replace(old_vars,new_vars,1)
            elif 'const VEHICLE_COVER_WIDTH=' not in text:
              raise SystemExit(f'cover variable anchor missing in {path}')

            if old_request in text:
              text=text.replace(old_request,new_request,1)
            elif 'width:VEHICLE_COVER_WIDTH' not in text:
              raise SystemExit(f'cover request anchor missing in {path}')

            path.write_text(text,encoding='utf-8')
          PY

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          for name in ('index.html','404.html'):
            text=Path(name).read_text(encoding='utf-8')
            scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
            if not scripts:
              raise SystemExit(f'No inline script found in {name}')
            Path(f'/tmp/{name}.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index.html.js
          node --check /tmp/404.html.js
          grep -q "const VEHICLE_COVER_WIDTH=window.innerWidth<768?420" index.html
          grep -q "width:VEHICLE_COVER_WIDTH" index.html

      - name: Commit optimization
        shell: bash
        run: |
          rm -f .github/workflows/performance-pass-3-thumbnails.yml
          rm -f .performance-pass-3-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use responsive lightweight vehicle thumbnails"
          git push

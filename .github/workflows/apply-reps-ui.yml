name: Apply AutoMatch Rep UI

on:
  push:
    paths:
      - ".github/workflows/apply-reps-ui.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild updated frontend
        shell: bash
        run: |
          cat tools/indexchunk_00.b64 tools/indexchunk_01.b64 tools/indexchunk_02.b64 \
            | base64 --decode \
            | gzip --decompress > index.html
          cp index.html 404.html
          rm -f tools/indexchunk_00.b64 tools/indexchunk_01.b64 tools/indexchunk_02.b64
          rm -f .github/workflows/apply-reps-ui.yml
      - name: Commit representative UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html tools .github/workflows/apply-reps-ui.yml
          git commit -m "Add multi-representative selection" || exit 0
          git push

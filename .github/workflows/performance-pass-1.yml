name: AutoMatch performance pass 1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add cached startup and lazy vehicle covers
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          files=[Path('index.html'),Path('404.html')]

          cache_block="""function readBootstrapCache(){
            try{
              const cached=JSON.parse(localStorage.getItem(BOOTSTRAP_CACHE_KEY)||'null');
              if(!cached||!cached.data||!cached.savedAt)return null;
              if(Date.now()-Number(cached.savedAt)>BOOTSTRAP_CACHE_MAX_AGE_MS)return null;
              return cached.data;
            }catch(error){
              console.warn('AutoMatch cache could not be read.',error);
              return null;
            }
          }

          function saveBootstrapCache(data){
            try{
              localStorage.setItem(BOOTSTRAP_CACHE_KEY,JSON.stringify({savedAt:Date.now(),data}));
            }catch(error){
              console.warn('AutoMatch cache could not be saved.',error);
            }
          }

          function startAutoMatch(){
            const cached=readBootstrapCache();
            const usedCache=Boolean(cached);
            if(cached)init(cached,{fromCache:true});

            apiJsonp('bootstrap')
              .then(data=>{
                saveBootstrapCache(data);
                init(data,{fromCache:false});
              })
              .catch(error=>{
                if(!usedCache)fail(error);
                else{
                  console.error(error);
                  toast('Showing recently saved inventory while the live refresh reconnects.');
                }
              });
          }

          startAutoMatch();


          function applyRepresentativeFromLink(){"""

          lazy_code=r'''function setVehicleCoverSlot(slot,src){
            const vehicleId=slot.dataset.coverId;
            const vehicle=inventory.find(item=>item.id===vehicleId);

            if(src){
              slot.innerHTML=`<img src="${esc(src)}" alt="${esc(vehicle?vehicle.year+' '+vehicle.make+' '+vehicle.model:'Vehicle')}" loading="lazy" decoding="async">`;
            }else{
              slot.innerHTML=`<div class="placeholder">${esc(vehicle?vehicle.make+' '+vehicle.model:'Vehicle Image')}</div>`;
            }

            slot.removeAttribute('data-cover-id');
          }

          function queueVehicleCover(slot){
            const vehicleId=slot.dataset.coverId;
            if(!vehicleId)return;

            if(coverCache.has(vehicleId)){
              setVehicleCoverSlot(slot,coverCache.get(vehicleId));
              return;
            }

            if(!coverQueue.has(vehicleId))coverQueue.set(vehicleId,new Set());
            coverQueue.get(vehicleId).add(slot);

            clearTimeout(coverQueueTimer);
            coverQueueTimer=setTimeout(flushVehicleCoverQueue,70);
          }

          async function flushVehicleCoverQueue(){
            if(coverRequestActive||!coverQueue.size)return;
            coverRequestActive=true;

            const ids=Array.from(coverQueue.keys()).slice(0,8);
            const slotsById=new Map();

            ids.forEach(id=>{
              slotsById.set(id,coverQueue.get(id));
              coverQueue.delete(id);
            });

            try{
              const response=await apiJsonp('covers',{ids:ids.join(',')});
              const covers=response&&response.covers?response.covers:{};

              ids.forEach(id=>{
                const src=covers[id]||'';
                coverCache.set(id,src);
                (slotsById.get(id)||[]).forEach(slot=>setVehicleCoverSlot(slot,src));
              });
            }catch(error){
              console.error(error);
              ids.forEach(id=>{
                (slotsById.get(id)||[]).forEach(slot=>setVehicleCoverSlot(slot,''));
              });
            }finally{
              coverRequestActive=false;
              if(coverQueue.size){
                clearTimeout(coverQueueTimer);
                coverQueueTimer=setTimeout(flushVehicleCoverQueue,70);
              }
            }
          }

          function hydrateVehicleCovers(container){
            const slots=Array.from(container.querySelectorAll('[data-cover-id]'));
            if(!slots.length)return;

            if(!('IntersectionObserver' in window)){
              slots.forEach(queueVehicleCover);
              return;
            }

            if(!coverObserver){
              coverObserver=new IntersectionObserver(entries=>{
                entries.forEach(entry=>{
                  if(!entry.isIntersecting)return;
                  coverObserver.unobserve(entry.target);
                  queueVehicleCover(entry.target);
                });
              },{rootMargin:'450px 0px',threshold:0.01});
            }

            slots.forEach(slot=>{
              const vehicleId=slot.dataset.coverId;
              if(coverCache.has(vehicleId))setVehicleCoverSlot(slot,coverCache.get(vehicleId));
              else coverObserver.observe(slot);
            });
          }

          '''

          for path in files:
            text=path.read_text(encoding='utf-8')

            if 'rel="preconnect" href="https://script.google.com"' not in text:
              text=text.replace(
                '<meta name="theme-color" content="#0b0b0d">',
                '<meta name="theme-color" content="#0b0b0d">\n<link rel="preconnect" href="https://script.google.com">\n<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>',
                1
              )

            if "BOOTSTRAP_CACHE_KEY='automatch.bootstrap.v2'" not in text:
              text=text.replace(
                "let repSelection={mode:'auto',repId:'',repName:''};\nlet galleryTouchStartX=0,galleryTouchStartY=0;",
                "let repSelection={mode:'auto',repId:'',repName:''};\nlet repSelectionTouched=false;\nlet galleryTouchStartX=0,galleryTouchStartY=0;\nconst BOOTSTRAP_CACHE_KEY='automatch.bootstrap.v2';\nconst BOOTSTRAP_CACHE_MAX_AGE_MS=24*60*60*1000;\nconst coverCache=new Map();\nconst coverQueue=new Map();\nlet coverQueueTimer=null;\nlet coverObserver=null;\nlet coverRequestActive=false;",
                1
              )

            if 'function readBootstrapCache()' not in text:
              pattern=r"apiJsonp\('bootstrap'\)\.then\(init\)\.catch\(fail\);\s*\n\s*function applyRepresentativeFromLink\(\)\{"
              text,count=re.subn(pattern,cache_block,text,count=1)
              if count!=1:
                raise SystemExit(f'bootstrap anchor missing in {path}')

            if 'if(repSelectionTouched)return;' not in text:
              text=text.replace(
                "function applyRepresentativeFromLink(){\n  const requestedRepId=",
                "function applyRepresentativeFromLink(){\n  if(repSelectionTouched)return;\n  const requestedRepId=",
                1
              )

            text=text.replace('function init(data){','function init(data,options={}){',1)

            if 'repSelectionTouched=true;' not in text:
              anchor="document.querySelectorAll('#repChoiceGrid .rep-choice').forEach(button=>button.onclick=()=>{"
              if anchor not in text:
                raise SystemExit(f'rep choice anchor missing in {path}')
              text=text.replace(anchor,anchor+"\n    repSelectionTouched=true;",1)

            if 'function queueVehicleCover(slot)' not in text:
              pattern=r"function hydrateVehicleCovers\(container\)\{.*?\n\}\n\nfunction bindCards\(container\)\{"
              text,count=re.subn(pattern,lazy_code+'function bindCards(container){',text,count=1,flags=re.S)
              if count!=1:
                raise SystemExit(f'cover loader block missing in {path}')

            text=text.replace('loading="lazy" onerror=', 'loading="lazy" decoding="async" onerror=')
            text=text.replace(
              '<img src="${esc(galleryImages[galleryIndex])}" alt="${esc(vehicleName)} image ${galleryIndex+1}">',
              '<img src="${esc(galleryImages[galleryIndex])}" alt="${esc(vehicleName)} image ${galleryIndex+1}" decoding="async">'
            )
            text=text.replace(
              '<img src="${esc(src)}" alt="">',
              '<img src="${esc(src)}" alt="" loading="lazy" decoding="async">'
            )

            path.write_text(text,encoding='utf-8')
          PY

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          for name in ('index.html','404.html'):
            text=Path(name).read_text(encoding='utf-8')
            scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
            if not scripts:
              raise SystemExit(f'No inline script found in {name}')
            Path(f'/tmp/{name}.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index.html.js
          node --check /tmp/404.html.js
          grep -q "function readBootstrapCache" index.html
          grep -q "function queueVehicleCover" index.html
          grep -q "rootMargin:'450px 0px'" index.html

      - name: Commit optimization
        shell: bash
        run: |
          rm -f .github/workflows/performance-pass-1.yml
          rm -f .performance-pass-1-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Speed up AutoMatch startup and vehicle image loading"
          git push
